services:
  aggregator:
    build: ./aggregator
    depends_on:
      store-aggregator:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_AGGREGATOR_USER}:${POSTGRES_AGGREGATOR_PASSWORD}@store-aggregator:5432/${POSTGRES_AGGREGATOR_DB}
      - BMKG_API_KEY=${BMKG_API_KEY}
      - PVMBG_TOKEN=${PVMBG_TOKEN}
      - BMKG_BASE_URL=${BMKG_BASE_URL}
      - PVMBG_BASE_URL=${PVMBG_BASE_URL}
      - SOURCE_TIMEOUT_MS=${SOURCE_TIMEOUT_MS}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS}


  pvmbg-mock:
    build: ./pvmbg
    depends_on:
      store-pvmbg:
        condition: service_healthy
    ports:
      - "8082:8082"
    develop:
      watch:
        - path: ./pvmbg/src
          action: sync
          target: /usr/local/app/src
        - path: ./pvmbg/package.json
          action: rebuild
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_PVMBG_USER}:${POSTGRES_PVMBG_PASSWORD}@store-pvmbg:5432/${POSTGRES_PVMBG_DB}
      - PVMBG_SECRET_KEY=${PVMBG_SECRET_KEY}
      - PVMBG_MIN_DELAY=${PVMBG_MIN_DELAY}
      - PVMBG_MAX_DELAY=${PVMBG_MAX_DELAY}

  bmkg-mock:
    build: ./bmkg
    depends_on:
      store-bmkg:
        condition: service_healthy
    ports:
      - "8081:8081"
    develop:
      watch:
        - path: ./bmkg/src
          action: sync
          target: /usr/local/app/src
        - path: ./bmkg/package.json
          action: rebuild
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_BMKG_USER}:${POSTGRES_BMKG_PASSWORD}@store-bmkg:5432/${POSTGRES_BMKG_DB}
      - BMKG_API_KEY=${BMKG_API_KEY}

  store-aggregator:
    image: postgres:17
    volumes:
      - aggregator-data:/var/lib/postgresql/data
      - ./postgres/init-scripts/aggregator:/docker-entrypoint-initdb.d:ro
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_AGGREGATOR_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AGGREGATOR_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AGGREGATOR_DB}
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  store-pvmbg:
    image: postgres:17
    volumes:
      - pvmbg-data:/var/lib/postgresql/data
      - ./postgres/init-scripts/pvmbg:/docker-entrypoint-initdb.d:ro
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_PVMBG_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PVMBG_PASSWORD}
      POSTGRES_DB: ${POSTGRES_PVMBG_DB}
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  store-bmkg:
    image: postgres:17
    volumes:
      - bmkg-data:/var/lib/postgresql/data
      - ./postgres/init-scripts/bmkg:/docker-entrypoint-initdb.d:ro
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_BMKG_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BMKG_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BMKG_DB}
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  aggregator-data:
  pvmbg-data:
  bmkg-data: