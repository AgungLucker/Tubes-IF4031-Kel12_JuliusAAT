services:
  aggregator:
    build: ./aggregator
    depends_on:
      store-aggregator:
        condition: service_healthy
    develop:
      watch:
        - path: ./aggregator/src
          action: sync
          target: /usr/local/app/src
        - path: ./aggregator/package.json
          action: rebuild
    ports:
      - "8091:8090"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_AGGREGATOR_USER}:${POSTGRES_AGGREGATOR_PASSWORD}@store-aggregator:5432/${POSTGRES_AGGREGATOR_DB}
      - BMKG_API_KEY=${BMKG_API_KEY}
      - PVMBG_TOKEN=${PVMBG_TOKEN}
      - BMKG_BASE_URL=${BMKG_BASE_URL}
      - PVMBG_BASE_URL=${PVMBG_BASE_URL}
      - SOURCE_TIMEOUT_MS=${SOURCE_TIMEOUT_MS}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672


  pvmbg-mock:
    build: ./pvmbg
    depends_on:
      store-pvmbg:
        condition: service_healthy
    ports:
      - "8082:8082"
    develop:
      watch:
        - path: ./pvmbg/src
          action: sync
          target: /usr/local/app/src
        - path: ./pvmbg/package.json
          action: rebuild
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_PVMBG_USER}:${POSTGRES_PVMBG_PASSWORD}@store-pvmbg:5432/${POSTGRES_PVMBG_DB}
      - PVMBG_SECRET_KEY=${PVMBG_SECRET_KEY}
      - PVMBG_MIN_DELAY=${PVMBG_MIN_DELAY}
      - PVMBG_MAX_DELAY=${PVMBG_MAX_DELAY}

  bmkg-mock:
    build: ./bmkg
    depends_on:
      store-bmkg:
        condition: service_healthy
    ports:
      - "8081:8081"
    develop:
      watch:
        - path: ./bmkg/src
          action: sync
          target: /usr/local/app/src
        - path: ./bmkg/package.json
          action: rebuild
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_BMKG_USER}:${POSTGRES_BMKG_PASSWORD}@store-bmkg:5432/${POSTGRES_BMKG_DB}
      - BMKG_API_KEY=${BMKG_API_KEY}

  store-aggregator:
    image: postgres:17
    volumes:
      - aggregator-data:/var/lib/postgresql/data
      - ./postgres/init-scripts/aggregator:/docker-entrypoint-initdb.d:ro
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_AGGREGATOR_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AGGREGATOR_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AGGREGATOR_DB}
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  store-pvmbg:
    image: postgres:17
    volumes:
      - pvmbg-data:/var/lib/postgresql/data
      - ./postgres/init-scripts/pvmbg:/docker-entrypoint-initdb.d:ro
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_PVMBG_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PVMBG_PASSWORD}
      POSTGRES_DB: ${POSTGRES_PVMBG_DB}
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  store-bmkg:
    image: postgres:17
    volumes:
      - bmkg-data:/var/lib/postgresql/data
      - ./postgres/init-scripts/bmkg:/docker-entrypoint-initdb.d:ro
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_BMKG_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BMKG_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BMKG_DB}
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  token-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${TOKEN_DB_PASSWORD}
      POSTGRES_DB: auth
    volumes:
      - token-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 3s
      retries: 10

  bnpb-token-service:
    build: ./bnpb-token
    depends_on:
      token-db:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - DATABASE_URL=postgres://auth:${TOKEN_DB_PASSWORD}@token-db:5432/auth
      - JWT_PRIVATE_KEY_FILE=/app/keys/private.pem
      - JWT_PUBLIC_KEY_FILE=/app/keys/public.pem
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - ACCESS_TOKEN_TTL_SECONDS=${ACCESS_TOKEN_TTL_SECONDS}
      - REFRESH_TOKEN_TTL_SECONDS=${REFRESH_TOKEN_TTL_SECONDS}
      - INTROSPECT_SERVICE_KEY=${INTROSPECT_SERVICE_KEY}
      - MEDIA_CLIENT_ID=${MEDIA_CLIENT_ID}
      - MEDIA_CLIENT_SECRET=${MEDIA_CLIENT_SECRET}
      - LAPANGAN_CLIENT_ID=${LAPANGAN_CLIENT_ID}
      - LAPANGAN_CLIENT_SECRET=${LAPANGAN_CLIENT_SECRET}
      - INTERNAL_CLIENT_ID=${INTERNAL_CLIENT_ID}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_CLIENT_SECRET}
    volumes:
      - ./bnpb-token/keys:/app/keys:ro

  client-service:
    build: ./client-service
    depends_on:
      - bnpb-token-service
      - aggregator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_PUBLIC_KEY_FILE=/app/keys/public.pem
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - TOKEN_SERVICE_URL=http://bnpb-token-service:8090
      - INTROSPECT_SERVICE_KEY=${INTROSPECT_SERVICE_KEY}
      - AGGREGATOR_URL=http://aggregator:8090
      - UPSTREAM_TIMEOUT_MS=3000
    volumes:
      - ./bnpb-token/keys/public.pem:/app/keys/public.pem:ro

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  consumer-dashboard:
    build: ./consumer/dashboard
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8101:8101"
    environment:
      - PORT=8101
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672


  consumer-notifier:
    build: ./consumer/notifier
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8102:8102"
    environment:
      - PORT=8102
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - QUEUE_NAME=notifier
      - BINDINGS=hazard.*.siaga,hazard.*.awas
      - NOTIFY_DELAY_MS=0

  consumer-portal-pemda:
    build: ./consumer/portal-pemda
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8103:8103"
    environment:
      - PORT=8103
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672


volumes:
  aggregator-data:
  pvmbg-data:
  bmkg-data:
  token-db-data: