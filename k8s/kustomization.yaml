apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sistem-informasi-kebencanaan-bnpb

configMapGenerator:
  - name: bmkg-init
    files:
      - bmkg-init.sql=databases/bmkg-init.sql
  - name: pvmbg-init
    files:
      - pvmbg-init.sql=databases/pvmbg-init.sql
  - name: satellite-init
    files:
      - satellite-init.sql=databases/satellite-init.sql
  - name: ingest-init
    files:
      - ingest-init.sql=databases/ingest-init.sql
  - name: prometheus-config
    files:
      - prometheus.yml=monitoring/files/prometheus.yml
  - name: grafana-datasources
    files:
      - prometheus.yml=monitoring/files/grafana-datasource.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=monitoring/files/grafana-dashboard-provider.yml
  - name: grafana-dashboards
    files:
      - satellite-processor.json=monitoring/files/grafana-dashboards/satellite-processor.json

# Manifests use the full GHCR name (ghcr.io/julius123123/bnpb-*:dev). `name` must match that
# exactly or newTag is silently ignored. Bump newTag to roll a new build.
images:
  - name: ghcr.io/julius123123/bnpb-aggregator
    newName: ghcr.io/julius123123/bnpb-aggregator
    newTag: d78848f
  - name: ghcr.io/julius123123/bnpb-bmkg
    newName: ghcr.io/julius123123/bnpb-bmkg
    newTag: cf3dbe3
  - name: ghcr.io/julius123123/bnpb-pvmbg
    newName: ghcr.io/julius123123/bnpb-pvmbg
    newTag: cf3dbe3
  - name: ghcr.io/julius123123/bnpb-client
    newName: ghcr.io/julius123123/bnpb-client
    newTag: cf3dbe3
  - name: ghcr.io/julius123123/bnpb-token
    newName: ghcr.io/julius123123/bnpb-token
    newTag: cf3dbe3
  - name: ghcr.io/julius123123/bnpb-dashboard
    newName: ghcr.io/julius123123/bnpb-dashboard
    newTag: cf3dbe3
  - name: ghcr.io/julius123123/bnpb-notifier
    newName: ghcr.io/julius123123/bnpb-notifier
    newTag: cf3dbe3
  - name: ghcr.io/julius123123/bnpb-satellite-processor
    newName: ghcr.io/julius123123/bnpb-satellite-processor
    newTag: cf3dbe3

generatorOptions:
  disableNameSuffixHash: true

resources:
  - 00-namespace.yaml

  - config/configmap.yaml
  - config/secrets.yaml

  - aggregator/deployment.yaml
  - aggregator/service.yaml
  - aggregator/pdb.yaml

  - bmkg/deployment.yaml
  - bmkg/service.yaml

  - pvmbg/deployment.yaml
  - pvmbg/service.yaml

  - satellite-processor/deployment.yaml
  - satellite-processor/service.yaml

  - client-service/deployment.yaml
  - client-service/service.yaml

  - bnpb-token/deployment.yaml
  - bnpb-token/service.yaml

  - consumers/dashboard.yaml
  - consumers/notifier.yaml

  - rabbitmq/statefulset.yaml
  - rabbitmq/service.yaml


  - databases/bmkg-db.yaml
  - databases/pvmbg-db.yaml
  - databases/token-db.yaml
  - databases/satellite-db.yaml
  - databases/ingest-db.yaml

  - network-policies/default-deny.yaml
  - network-policies/database-isolation.yaml
  - network-policies/application-traffic.yaml

  - monitoring/grafana-secret.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml
  - monitoring/network-policies.yaml
