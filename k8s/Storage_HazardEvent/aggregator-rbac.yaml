apiVersion: v1
kind: ServiceAccount
metadata:
  name: aggregator
  namespace: sistem-informasi-kebencanaan-bnpb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aggregator-read-pods
  namespace: sistem-informasi-kebencanaan-bnpb
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aggregator-read-pods
  namespace: sistem-informasi-kebencanaan-bnpb
subjects:
  - kind: ServiceAccount
    name: aggregator
    namespace: sistem-informasi-kebencanaan-bnpb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aggregator-read-pods
