apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hazardevent-shards-ingress
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels:
      group: hazardevent
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: aggregator
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - podSelector:
            matchLabels:
              group: hazardevent
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8000 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
