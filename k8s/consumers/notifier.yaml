apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-notifier
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-notifier
  template:
    metadata:
      labels:
        app: consumer-notifier
    spec:
      containers:
        - name: consumer-notifier
          image: consumer-notifier:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8102
          env:
            - name: PORT
              value: "8102"
            - name: QUEUE_NAME
              value: notifier
            - name: BINDINGS
              value: hazard.*.siaga,hazard.*.awas
            - name: NOTIFY_DELAY_MS
              value: "0"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_URL
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-notifier
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  selector:
    app: consumer-notifier
  ports:
    - port: 8102
      targetPort: 8102
