apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-notifier
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-notifier
  template:
    metadata:
      labels:
        app: consumer-notifier
        role: consumer
    spec:
      containers:
        - name: consumer-notifier
          image: ghcr.io/julius123123/bnpb-notifier:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8102
          env:
            - name: PORT
              value: "8102"
            - name: QUEUE_NAME
              value: notifier
            - name: BINDINGS
              value: hazard.*.siaga,hazard.*.awas
            - name: NOTIFY_DELAY_MS
              value: "0"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_URL
            - name: OTEL_SERVICE_NAME
              value: consumer-notifier
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318

          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-notifier
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  selector:
    app: consumer-notifier
  ports:
    - port: 8102
      targetPort: 8102
---
# Headless: DNS mengembalikan IP tiap pod agar Prometheus scrape setiap replika secara terpisah.
apiVersion: v1
kind: Service
metadata:
  name: consumer-notifier-metrics
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: consumer-notifier
  ports:
    - name: http
      port: 8102
      targetPort: 8102
