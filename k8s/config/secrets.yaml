apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: sistem-informasi-kebencanaan-bnpb
type: Opaque
stringData:
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
---
apiVersion: v1
