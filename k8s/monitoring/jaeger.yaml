apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        role: other
    spec:
      nodeSelector:
        kubernetes.io/hostname: node-c
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0
          ports:
            - containerPort: 16686
            - containerPort: 4318
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-http
      port: 4318
      targetPort: 4318
  type: ClusterIP
