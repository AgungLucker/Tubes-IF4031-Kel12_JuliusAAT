apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        role: monitoring
    spec:
      containers:
        - name: grafana
          # 13.x boots an embedded unified-storage apiserver plus many app-platform controllers and
          # never opened port 3000 on this loaded cluster (gRPC deadline exceeded). 11.5 boots in
          # seconds and still loads our dashboard (schemaVersion 39, timeseries/stat panels only).
          # If 11.5.2 cannot be pulled, 10.4.2 also works. The Compose file still uses 13.3.1.
          image: grafana/grafana:11.5.2
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: grafana-credentials

          env:
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "false"
            - name: GF_ALERTING_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              # Cap CPU so Grafana cannot starve the control plane and the databases again.
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        # RAM-backed: Grafana's SQLite runs hundreds of migrations at first start and every
        # fsync on disk is slow here. Data is lost on restart anyway (provisioned from files).
        # tmpfs counts against the memory limit above.
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
