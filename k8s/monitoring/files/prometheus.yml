global:
  scrape_interval: 15s

scrape_configs:
  - job_name: satellite-processor
    static_configs:
    - targets: ["satellite-processor:8083"]
  - job_name: aggregator
    scrape_interval: 5s            
    dns_sd_configs:
      - names: ["aggregator-metrics.sistem-informasi-kebencanaan-bnpb.svc.cluster.local"]
        type: A
        port: 8090
        refresh_interval: 10s
  - job_name: client-service
    scrape_interval: 5s
    dns_sd_configs:
      - names: ["client-service-metrics.sistem-informasi-kebencanaan-bnpb.svc.cluster.local"]
        type: A
        port: 8080
        refresh_interval: 10s
