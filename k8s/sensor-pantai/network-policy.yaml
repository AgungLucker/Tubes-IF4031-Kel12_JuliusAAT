# Only the aggregator may talk to the sensor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aggregator-to-sensor-pantai
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels: {app: sensor-pantai}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: aggregator}}
      ports: [{protocol: TCP, port: 8080}]
