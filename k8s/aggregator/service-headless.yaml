# Headless twin of the aggregator Service: DNS returns every pod IP, so Prometheus scrapes each
# instance separately (the breaker/outbox metrics are only non-zero on the instance that leads).
apiVersion: v1
kind: Service
metadata:
  name: aggregator-pods
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  clusterIP: None
  selector:
    app: aggregator
  ports:
    - name: http
      port: 8090
      targetPort: 8090
