apiVersion: apps/v1
kind: Deployment
metadata: 
  name: aggregator
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
        role: aggregator
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aggregator
      containers:
        - name: aggregator
          image: ghcr.io/julius123123/bnpb-aggregator:dev
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8090
          
          envFrom:
            - configMapRef:
                name: bnpb-config

          env:
            - name: BMKG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: BMKG_API_KEY

            - name: PVMBG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: PVMBG_TOKEN

            - name: SATELLITE_PROCESSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: SATELLITE_PROCESSOR_API_KEY

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aggregator-db-credentials
                  key: DATABASE_URL

            - name: INGEST_STATUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ingest-status-db-credentials
                  key: DATABASE_URL

            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_URL
          
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"