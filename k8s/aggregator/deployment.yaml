apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
        role: aggregator
    spec:
      serviceAccountName: aggregator
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: aggregator
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aggregator
      containers:
        - name: aggregator
          image: ghcr.io/julius123123/bnpb-aggregator:dev
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8090
          startupProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8090
            periodSeconds: 3
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "8"]

          envFrom:
            - configMapRef:
                name: bnpb-config

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PANTAI_BASE_URL
              value: "http://sensor-pantai:8080"
            - name: PANTAI_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pantai-token
                  key: token
                  optional: true   # without the secret the aggregator simply does not poll the sensor
            - name: LEASE_TTL_SECONDS
              value: "15"
            - name: SHUTDOWN_DRAIN_MS
              value: "3000"
            - name: BMKG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: BMKG_API_KEY

            - name: PVMBG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: PVMBG_TOKEN

            - name: SATELLITE_PROCESSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: SATELLITE_PROCESSOR_API_KEY
            - name: SHARD_COUNT
              value: "3"
            - name: SHARD_1_URI
              valueFrom:
                secretKeyRef:
                  name: shard-1-app
                  key: uri
            - name: SHARD_2_URI
              valueFrom:
                secretKeyRef:
                  name: shard-2-app
                  key: uri
            - name: SHARD_3_URI
              valueFrom:
                secretKeyRef:
                  name: shard-3-app
                  key: uri
            - name: AUDIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aggregator-audit
                  key: AUDIT_TOKEN
                  optional: true

            - name: INGEST_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ingest-db-credentials
                  key: DATABASE_URL

            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_URL
            - name: OTEL_SERVICE_NAME
              value: aggregator
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318

          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"