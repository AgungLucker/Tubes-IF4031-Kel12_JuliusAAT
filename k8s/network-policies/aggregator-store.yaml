apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aggergator-store-isolation
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels:
      app: store-aggregator
  policyTypes:
    - Ingress

  ingress:
    - from:
      - podSelector:
          matchLabels:
            app: aggregator
      ports:
        - protocol: TCP
          port: 5432