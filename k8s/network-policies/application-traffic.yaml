
# 1. Aggregator -> BMKG Mock dan PVMBG Mock
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aggregator-to-mock-services
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - bmkg-mock
          - pvmbg-mock
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: aggregator
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082

---
# 2. Client Service -> Aggregator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-aggregator
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels:
      app: aggregator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: client-service
      ports:
        - protocol: TCP
          port: 8090

