apiVersion: v1
kind: Service
metadata:
  name: store-bmkg
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  clusterIP: None
  selector:
    app: store-bmkg
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: store-bmkg
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  serviceName: store-bmkg
  replicas: 1
  selector:
    matchLabels:
      app: store-bmkg
  template:
    metadata:
      labels:
        app: store-bmkg
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: bmkg-db-credentials
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "bmkg"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "bmkg"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/001-init.sql
              subPath: bmkg-init.sql
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1Gi"

      volumes:
        - name: init
          configMap:
            name: bmkg-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
